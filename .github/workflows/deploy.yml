name: Deploy

on:
  push:
    branches: [main, QA]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ github.ref_name == 'QA' && 'https://qa.true-farming.com' || 'https://www.true-farming.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ env.SITE_URL }}
          PATREON_REDIRECT_URI: ${{ env.SITE_URL }}/auth/patreon/callback
          NEXT_PUBLIC_PATREON_REDIRECT_URI: ${{ env.SITE_URL }}/auth/patreon/callback
          NEXT_PUBLIC_DISCORD_REDIRECT_URI: ${{ env.SITE_URL }}/auth/discord/callback
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en el repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" = "QA" ]; then
            npm run cf:deploy:qa
          else
            npm run cf:deploy
          fi
