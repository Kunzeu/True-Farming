name: Deploy

on:
  push:
    branches: [QA]
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IS_PROD: ${{ github.event_name == 'release' }}
      SITE_URL: ${{ github.event_name == 'release' && 'https://www.true-farming.com' || 'https://qa.true-farming.com' }}
      ENV_LABEL: ${{ github.event_name == 'release' && 'Production' || 'QA' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ env.SITE_URL }}
          PATREON_REDIRECT_URI: ${{ env.SITE_URL }}/auth/patreon/callback
          NEXT_PUBLIC_PATREON_REDIRECT_URI: ${{ env.SITE_URL }}/auth/patreon/callback
          DISCORD_REDIRECT_URI: ${{ env.SITE_URL }}/auth/discord/callback
          NEXT_PUBLIC_DISCORD_REDIRECT_URI: ${{ env.SITE_URL }}/auth/discord/callback
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en el repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${IS_PROD}" = "true" ]; then
            npm run cf:deploy
          else
            npm run cf:deploy:qa
          fi
      - name: Notificar Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then COLOR=3066993; EMOJI="✅"; else COLOR=15158332; EMOJI="❌"; fi
          curl -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" \
            -d "{\"embeds\":[{\"title\":\"${EMOJI} Deploy ${ENV_LABEL} ${STATUS}\",\"color\":${COLOR},\"fields\":[{\"name\":\"Entorno\",\"value\":\"${ENV_LABEL}\",\"inline\":true},{\"name\":\"Ref\",\"value\":\"${{ github.ref_name }}\",\"inline\":true},{\"name\":\"Commit\",\"value\":\"${{ github.sha }}\",\"inline\":true},{\"name\":\"Autor\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}"
