name: 'PR and Workflow Notifications'

on:
  pull_request:
    types: [opened, reopened]
  workflow_run:
    workflows: ['PR Checks', 'Deploy', 'Draft release notes']
    types: [completed]

jobs:
  notify-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          WEBHOOK="${DISCORD_WEBHOOK_URL:-$DISCORD_WEBHOOK}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Sin DISCORD_WEBHOOK_URL ni DISCORD_WEBHOOK; se omite la notificación."
            exit 0
          fi
          # Discord exige User-Agent; sin él suele devolver 403.
          # wait=true: respuesta síncrona y errores más claros.
          case "$WEBHOOK" in
            *\?*) WEBHOOK="${WEBHOOK}&wait=true" ;;
            *)    WEBHOOK="${WEBHOOK}?wait=true" ;;
          esac
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({
            "username": "GitHub PR Notifier",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "New PR opened",
              "description": "**" + os.environ["PR_TITLE"] + "**",
              "url": os.environ["PR_URL"],
              "color": 3447003,
              "fields": [
                {"name": "Creator", "value": os.environ["PR_USER"], "inline": True},
                {"name": "URL", "value": os.environ["PR_URL"], "inline": False}
              ],
              "thumbnail": {"url": "https://github.githubassets.com/images/modules/logos_page/Octocat.png"}
            }]
          }))')
          HTTP=$(curl -sS -o /tmp/discord-out.txt -w "%{http_code}" \
            -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: TrueFarming-GitHubNotify/1.0" \
            --data "$PAYLOAD")
          echo "Discord HTTP $HTTP"
          cat /tmp/discord-out.txt || true
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "204" ]; then
            echo "::warning::Discord webhook falló ($HTTP). Revisa el secret DISCORD_WEBHOOK_URL (URL completa del webhook)."
          fi
          exit 0

  notify-failure:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Send Discord notification for workflow failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          WEBHOOK="${DISCORD_WEBHOOK_URL:-$DISCORD_WEBHOOK}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Sin DISCORD_WEBHOOK_URL ni DISCORD_WEBHOOK; se omite la notificación."
            exit 0
          fi
          case "$WEBHOOK" in
            *\?*) WEBHOOK="${WEBHOOK}&wait=true" ;;
            *)    WEBHOOK="${WEBHOOK}?wait=true" ;;
          esac
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({
            "username": "GitHub Workflow Notifier",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "Workflow Failed",
              "color": 15158332,
              "fields": [
                {"name": "Workflow", "value": os.environ["WF_NAME"], "inline": False},
                {"name": "Branch", "value": os.environ["WF_BRANCH"] or "—", "inline": True},
                {"name": "Repository", "value": os.environ["REPO"], "inline": True},
                {"name": "URL", "value": os.environ["WF_URL"], "inline": False}
              ],
              "thumbnail": {"url": "https://github.githubassets.com/images/modules/logos_page/Octocat.png"}
            }]
          }))')
          HTTP=$(curl -sS -o /tmp/discord-out.txt -w "%{http_code}" \
            -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: TrueFarming-GitHubNotify/1.0" \
            --data "$PAYLOAD")
          echo "Discord HTTP $HTTP"
          cat /tmp/discord-out.txt || true
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "204" ]; then
            echo "::warning::Discord webhook falló ($HTTP). Revisa el secret DISCORD_WEBHOOK_URL."
          fi
          exit 0
