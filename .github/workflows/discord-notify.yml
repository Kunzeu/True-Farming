name: 'PR and Workflow Notifications'

on:
  pull_request:
    types: [opened, reopened]
  workflow_run:
    workflows: ['PR Checks', 'Deploy', 'Draft release notes']
    types: [completed]

jobs:
  notify-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          WEBHOOK="${DISCORD_WEBHOOK_URL:-$DISCORD_WEBHOOK}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Sin DISCORD_WEBHOOK_URL ni DISCORD_WEBHOOK; se omite la notificación."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
            "username": "GitHub PR Notifier",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "New PR opened",
              "description": f"**{os.environ['PR_TITLE']}**",
              "url": os.environ["PR_URL"],
              "color": 3447003,
              "fields": [
                {"name": "Creator", "value": os.environ["PR_USER"], "inline": True},
                {"name": "URL", "value": os.environ["PR_URL"], "inline": False},
              ],
              "thumbnail": {
                "url": "https://github.githubassets.com/images/modules/logos_page/Octocat.png"
              },
            }],
          }
          webhook = os.environ.get("DISCORD_WEBHOOK_URL") or os.environ.get("DISCORD_WEBHOOK")
          req = urllib.request.Request(
            webhook,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
          )
          with urllib.request.urlopen(req) as res:
            print(res.status)
          PY

  notify-failure:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Send Discord notification for workflow failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          WEBHOOK="${DISCORD_WEBHOOK_URL:-$DISCORD_WEBHOOK}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Sin DISCORD_WEBHOOK_URL ni DISCORD_WEBHOOK; se omite la notificación."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
            "username": "GitHub Workflow Notifier",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "Workflow Failed",
              "color": 15158332,
              "fields": [
                {"name": "Workflow", "value": os.environ["WF_NAME"], "inline": False},
                {"name": "Branch", "value": os.environ["WF_BRANCH"], "inline": True},
                {"name": "Repository", "value": os.environ["REPO"], "inline": True},
                {"name": "URL", "value": os.environ["WF_URL"], "inline": False},
              ],
              "thumbnail": {
                "url": "https://github.githubassets.com/images/modules/logos_page/Octocat.png"
              },
            }],
          }
          webhook = os.environ.get("DISCORD_WEBHOOK_URL") or os.environ.get("DISCORD_WEBHOOK")
          req = urllib.request.Request(
            webhook,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
          )
          with urllib.request.urlopen(req) as res:
            print(res.status)
          PY
