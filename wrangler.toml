name = "true-farming"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ponytail: fill HYPERDRIVE id after creating the binding in CF dashboard
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_HYPERDRIVE_ID"

[[r2_buckets]]
binding = "ROUTES_IMAGES"
bucket_name = "true-farming-routes"

# Cron: was vercel.json giveaways auto-enroll
[triggers]
crons = ["5 19 * * *"]

[vars]
# Non-secret defaults; secrets via `wrangler secret` / dashboard env
PUBLIC_SITE_URL = "https://www.true-farming.com"
