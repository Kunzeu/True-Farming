name = "true-farming"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive → Supabase (Workers can't open raw Postgres TCP without this)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3cf64a7fbb0e4c63b7f9adae2103dcf1"

[[r2_buckets]]
binding = "ROUTES_IMAGES"
bucket_name = "true-farming-routes"

# Cron: was vercel.json giveaways auto-enroll
[triggers]
crons = ["5 19 * * *"]

[vars]
# Non-secret defaults; secrets via `wrangler secret` / dashboard env
# EMAIL_FROM is a Worker secret (noreply@true-farming.com) — do not also put it here
PUBLIC_SITE_URL = "https://www.true-farming.com"
NEXT_PUBLIC_APP_URL = "https://www.true-farming.com"
PATREON_CLIENT_ID = "PWrLYPmnp_Wm8B2xBDTeRUrXcJgh96VNUev0_goTzoeYSus_Zhnukdgh-yIhw5VC"
PATREON_REDIRECT_URI = "https://www.true-farming.com/auth/patreon/callback"
DISCORD_REDIRECT_URI = "https://www.true-farming.com/auth/discord/callback"

# QA worker: `wrangler deploy --env qa` → https://qa.true-farming.com
# Copy secrets once: wrangler secret put JWT_SECRET --env qa  (same for the rest)
[env.qa]
name = "true-farming-qa"

[env.qa.vars]
PUBLIC_SITE_URL = "https://qa.true-farming.com"
NEXT_PUBLIC_APP_URL = "https://qa.true-farming.com"
PATREON_CLIENT_ID = "PWrLYPmnp_Wm8B2xBDTeRUrXcJgh96VNUev0_goTzoeYSus_Zhnukdgh-yIhw5VC"
PATREON_REDIRECT_URI = "https://qa.true-farming.com/auth/patreon/callback"
DISCORD_REDIRECT_URI = "https://qa.true-farming.com/auth/discord/callback"

[[env.qa.routes]]
pattern = "qa.true-farming.com"
custom_domain = true

[[env.qa.hyperdrive]]
binding = "HYPERDRIVE"
id = "3cf64a7fbb0e4c63b7f9adae2103dcf1"

[[env.qa.r2_buckets]]
binding = "ROUTES_IMAGES"
bucket_name = "true-farming-routes"
